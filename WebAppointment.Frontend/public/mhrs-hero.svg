<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none">
  <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0f9ff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow-sm" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
    <filter id="shadow-lg" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <clipPath id="round-lg">
      <rect width="640" height="400" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round-lg)">
    <!-- Background -->
    <rect width="640" height="400" fill="url(#card-bg)"/>

    <!-- Subtle grid pattern -->
    <g opacity=".06" stroke="#3b82f6" stroke-width=".5">
      <line x1="0" y1="40" x2="640" y2="40"/><line x1="0" y1="80" x2="640" y2="80"/>
      <line x1="0" y1="120" x2="640" y2="120"/><line x1="0" y1="160" x2="640" y2="160"/>
      <line x1="0" y1="200" x2="640" y2="200"/><line x1="0" y1="240" x2="640" y2="240"/>
      <line x1="0" y1="280" x2="640" y2="280"/><line x1="0" y1="320" x2="640" y2="320"/>
      <line x1="0" y1="360" x2="640" y2="360"/>
      <line x1="80" y1="0" x2="80" y2="400"/><line x1="160" y1="0" x2="160" y2="400"/>
      <line x1="240" y1="0" x2="240" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
      <line x1="400" y1="0" x2="400" y2="400"/><line x1="480" y1="0" x2="480" y2="400"/>
      <line x1="560" y1="0" x2="560" y2="400"/>
    </g>

    <!-- Decorative circles -->
    <circle cx="520" cy="60" r="80" fill="#3b82f6" opacity=".05"/>
    <circle cx="580" cy="340" r="120" fill="#60a5fa" opacity=".06"/>
    <circle cx="100" cy="350" r="60" fill="#3b82f6" opacity=".04"/>

    <!-- ========== Main Dashboard Card ========== -->
    <g filter="url(#shadow-lg)">
      <rect x="40" y="30" width="560" height="340" rx="16" fill="#fff"/>
    </g>

    <!-- Dashboard header bar -->
    <rect x="40" y="30" width="560" height="48" rx="16" fill="#fff"/>
    <rect x="40" y="62" width="560" height="16" fill="#fff"/>
    <line x1="40" y1="78" x2="600" y2="78" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Header dots -->
    <circle cx="62" cy="54" r="5" fill="#f87171"/>
    <circle cx="80" cy="54" r="5" fill="#fbbf24"/>
    <circle cx="98" cy="54" r="5" fill="#34d399"/>

    <!-- Header title -->
    <text x="120" y="58" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#334155">MHRS — Randevu Paneli</text>

    <!-- Header right icons -->
    <circle cx="560" cy="54" r="12" fill="#f1f5f9"/>
    <circle cx="560" cy="54" r="6" fill="url(#accent2)" opacity=".6"/>
    <rect x="530" y="48" width="14" height="12" rx="3" fill="#f1f5f9"/>

    <!-- ========== Left Sidebar ========== -->
    <rect x="40" y="78" width="130" height="292" fill="#f8fafc"/>
    <line x1="170" y1="78" x2="170" y2="370" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Sidebar nav items -->
    <rect x="52" y="92" width="106" height="30" rx="8" fill="url(#accent)" opacity=".9"/>
    <text x="68" y="112" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#fff">Dashboard</text>

    <g opacity=".55">
      <rect x="52" y="132" width="106" height="28" rx="8" fill="transparent"/>
      <text x="68" y="150" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Randevular</text>
    </g>
    <g opacity=".55">
      <rect x="52" y="168" width="106" height="28" rx="8" fill="transparent"/>
      <text x="68" y="186" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Hastalar</text>
    </g>
    <g opacity=".55">
      <rect x="52" y="204" width="106" height="28" rx="8" fill="transparent"/>
      <text x="68" y="222" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Doktorlar</text>
    </g>
    <g opacity=".55">
      <rect x="52" y="240" width="106" height="28" rx="8" fill="transparent"/>
      <text x="68" y="258" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Raporlar</text>
    </g>

    <!-- Sidebar user avatar -->
    <circle cx="105" cy="340" r="16" fill="url(#accent2)"/>
    <text x="99" y="345" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#fff">AY</text>

    <!-- ========== Main Content ========== -->

    <!-- Stat cards row -->
    <g filter="url(#shadow-sm)">
      <rect x="185" y="92" width="120" height="68" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width=".5"/>
    </g>
    <text x="197" y="114" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">Bugünkü Randevu</text>
    <text x="197" y="140" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#1e293b">24</text>
    <text x="232" y="140" font-family="system-ui,sans-serif" font-size="10" fill="#10b981">↑ 12%</text>

    <g filter="url(#shadow-sm)">
      <rect x="318" y="92" width="120" height="68" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width=".5"/>
    </g>
    <text x="330" y="114" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">Aktif Hasta</text>
    <text x="330" y="140" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#1e293b">1,248</text>
    <text x="387" y="140" font-family="system-ui,sans-serif" font-size="10" fill="#10b981">↑ 8%</text>

    <g filter="url(#shadow-sm)">
      <rect x="451" y="92" width="135" height="68" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width=".5"/>
    </g>
    <text x="463" y="114" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">Onay Bekleyen</text>
    <text x="463" y="140" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#f59e0b">7</text>
    <circle cx="564" cy="126" r="16" fill="#fef3c7"/>
    <text x="558" y="130" font-family="system-ui,sans-serif" font-size="14" fill="#f59e0b">!</text>

    <!-- ========== Chart area ========== -->
    <g filter="url(#shadow-sm)">
      <rect x="185" y="174" width="253" height="140" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width=".5"/>
    </g>
    <text x="197" y="196" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#334155">Haftalık Randevu</text>

    <!-- Bar chart -->
    <rect x="210" y="260" width="22" height="38" rx="4" fill="#dbeafe"/>
    <rect x="240" y="240" width="22" height="58" rx="4" fill="#dbeafe"/>
    <rect x="270" y="220" width="22" height="78" rx="4" fill="url(#accent2)"/>
    <rect x="300" y="248" width="22" height="50" rx="4" fill="#dbeafe"/>
    <rect x="330" y="230" width="22" height="68" rx="4" fill="#dbeafe"/>
    <rect x="360" y="255" width="22" height="43" rx="4" fill="#dbeafe"/>
    <rect x="390" y="268" width="22" height="30" rx="4" fill="#dbeafe"/>

    <!-- Chart x labels -->
    <text x="214" y="306" font-family="system-ui,sans-serif" font-size="8" fill="#94a3b8">Pzt</text>
    <text x="244" y="306" font-family="system-ui,sans-serif" font-size="8" fill="#94a3b8">Sal</text>
    <text x="273" y="306" font-family="system-ui,sans-serif" font-size="8" fill="#334155" font-weight="600">Çar</text>
    <text x="302" y="306" font-family="system-ui,sans-serif" font-size="8" fill="#94a3b8">Per</text>
    <text x="333" y="306" font-family="system-ui,sans-serif" font-size="8" fill="#94a3b8">Cum</text>
    <text x="364" y="306" font-family="system-ui,sans-serif" font-size="8" fill="#94a3b8">Cts</text>
    <text x="393" y="306" font-family="system-ui,sans-serif" font-size="8" fill="#94a3b8">Paz</text>

    <!-- ========== Recent appointments table ========== -->
    <g filter="url(#shadow-sm)">
      <rect x="451" y="174" width="135" height="140" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width=".5"/>
    </g>
    <text x="463" y="196" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#334155">Son Randevular</text>

    <!-- Row 1 -->
    <circle cx="474" cy="218" r="8" fill="#dbeafe"/>
    <text x="486" y="221" font-family="system-ui,sans-serif" font-size="9" fill="#334155">Ahmet Y.</text>
    <rect x="544" y="212" width="32" height="14" rx="4" fill="#dcfce7"/>
    <text x="549" y="222" font-family="system-ui,sans-serif" font-size="7" font-weight="600" fill="#16a34a">Onaylı</text>

    <!-- Row 2 -->
    <circle cx="474" cy="242" r="8" fill="#fce7f3"/>
    <text x="486" y="245" font-family="system-ui,sans-serif" font-size="9" fill="#334155">Ayşe K.</text>
    <rect x="544" y="236" width="32" height="14" rx="4" fill="#fef9c3"/>
    <text x="548" y="246" font-family="system-ui,sans-serif" font-size="7" font-weight="600" fill="#ca8a04">Bekl.</text>

    <!-- Row 3 -->
    <circle cx="474" cy="266" r="8" fill="#e0e7ff"/>
    <text x="486" y="269" font-family="system-ui,sans-serif" font-size="9" fill="#334155">Mehmet D.</text>
    <rect x="544" y="260" width="32" height="14" rx="4" fill="#dcfce7"/>
    <text x="549" y="270" font-family="system-ui,sans-serif" font-size="7" font-weight="600" fill="#16a34a">Onaylı</text>

    <!-- Row 4 -->
    <circle cx="474" cy="290" r="8" fill="#fef3c7"/>
    <text x="486" y="293" font-family="system-ui,sans-serif" font-size="9" fill="#334155">Fatma S.</text>
    <rect x="544" y="284" width="32" height="14" rx="4" fill="#dcfce7"/>
    <text x="549" y="294" font-family="system-ui,sans-serif" font-size="7" font-weight="600" fill="#16a34a">Onaylı</text>

    <!-- ========== Bottom bar ========== -->
    <g filter="url(#shadow-sm)">
      <rect x="185" y="326" width="401" height="36" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width=".5"/>
    </g>

    <!-- Quick action buttons -->
    <rect x="197" y="333" width="88" height="22" rx="6" fill="url(#accent)"/>
    <text x="210" y="348" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#fff">+ Yeni Randevu</text>

    <rect x="294" y="333" width="76" height="22" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width=".5"/>
    <text x="305" y="348" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">Hasta Ekle</text>

    <rect x="380" y="333" width="76" height="22" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width=".5"/>
    <text x="391" y="348" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">Dışa Aktar</text>

    <!-- Search bar in bottom -->
    <rect x="466" y="333" width="110" height="22" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width=".5"/>
    <text x="478" y="348" font-family="system-ui,sans-serif" font-size="9" fill="#94a3b8">🔍 Ara...</text>

    <!-- ========== Floating notification badge ========== -->
    <g filter="url(#shadow-sm)">
      <rect x="530" y="36" width="60" height="22" rx="6" fill="url(#green)"/>
    </g>
    <text x="541" y="51" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#fff">✓ Çevrimiçi</text>
  </g>
</svg>
